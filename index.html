<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Library</title>
<style>
  :root {
    --bg: #0e0e10;
    --canvas-bg: #131316;
    --panel: #17171a;
    --panel2: #1d1d21;
    --border: #2a2a2e;
    --text: #eaeaec;
    --muted: #9a9aa0;
    --accent: #7c9cff;
    --star: #f5c542;
    --star-off: #3a3a3f;
  }
  * { box-sizing: border-box; }
  .icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,14,16,0.94);
    backdrop-filter: blur(8px);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  nav#catnav { display: flex; }
  nav#catnav a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border: 1px solid var(--accent);
    border-radius: 20px;
    white-space: nowrap;
  }
  nav#catnav a:hover { background: rgba(124,156,255,0.12); }
  .crumb { color: var(--muted); font-size: 13px; }

  main { padding: 0 24px 100px; }

  #home { margin-top: 20px; }
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .category-tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .category-tile:hover { border-color: var(--accent); transform: translateY(-3px); }

  .tile-preview {
    position: relative;
    height: 140px;
    background: var(--canvas-bg);
    overflow: hidden;
  }
  .tile-preview img {
    position: absolute;
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--panel);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .tile-preview .p1 { left: 14px; top: 18px; transform: rotate(-6deg); z-index: 1; }
  .tile-preview .p2 { left: 78px; top: 8px; transform: rotate(3deg); z-index: 2; }
  .tile-preview .p3 { left: 142px; top: 20px; transform: rotate(-2deg); z-index: 1; }
  .tile-preview .p-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    opacity: 0.25;
  }

  .tile-body { padding: 14px 18px 18px; }
  .category-tile h3 { margin: 0 0 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .category-tile .tile-count { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .category-tile .tile-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin: 0; }

  .category { margin-top: 0; display: none; }
  .category.active { display: block; }

  .floating-toolbar {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    align-items: center;
    gap: 4px;
    background: rgba(23,23,26,0.92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 15;
  }
  .floating-toolbar.open { display: flex; }
  .floating-toolbar .ft-group { display: flex; align-items: center; gap: 2px; padding: 0 4px; }
  .floating-toolbar .ft-divider { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
  .floating-toolbar button, .floating-toolbar .ft-icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    height: 32px;
    min-width: 32px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .floating-toolbar button:hover, .floating-toolbar .ft-icon-btn:hover { background: var(--panel2); color: var(--text); }
  .floating-toolbar .zoom-level { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; }
  .floating-toolbar input[type="text"] {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    width: 140px;
    height: 32px;
  }
  .floating-toolbar select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0 8px;
    border-radius: 8px;
    font-size: 12px;
    height: 32px;
  }

  .global-search {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    width: min(480px, 90vw);
    z-index: 25;
    background: rgba(23,23,26,0.92);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .global-search .gs-icon { color: var(--accent); font-size: 15px; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap .search-ghost, .search-wrap #globalSearch {
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    padding: 10px 0;
    margin: 0;
    border: none;
    white-space: pre;
  }
  .search-ghost {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .search-ghost .typed { color: transparent; }
  .search-ghost .suggest { color: var(--muted); opacity: 0.65; }
  #globalSearch {
    position: relative;
    display: block;
    width: 100%;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  #globalSearch::placeholder { color: var(--muted); }

  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    max-height: 60vh;
    overflow-y: auto;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }
  .search-dropdown.open { display: block; }
  .search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .search-row:hover { background: var(--accent); }
  .search-row:hover .sr-title, .search-row:hover .sr-sub { color: #0e0e10; }
  .sr-thumb-icon { font-size: 16px; flex-shrink: 0; }
  .sr-text { min-width: 0; }
  .sr-title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .canvas-viewport {
    position: relative;
    width: 100%;
    height: calc(100vh - 56px);
    overflow: hidden;
    background:
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--canvas-bg);
    cursor: default;
  }
  body.space-pan-mode .canvas-viewport { cursor: grab; }
  .canvas-viewport.panning { cursor: grabbing; }
  .canvas-world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  .zone-label {
    position: absolute;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .zone-label .zone-count { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.7; }

  .annotation {
    position: absolute;
    font-size: 20px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: grab;
    outline: none;
    min-width: 40px;
    min-height: 28px;
  }
  .annotation:hover, .annotation:focus { background: rgba(255,255,255,0.06); }
  .annotation.dragging { cursor: grabbing; }
  .annotation-toolbar {
    display: none;
    position: absolute;
    top: -34px;
    left: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    gap: 4px;
    z-index: 20;
  }
  .annotation-toolbar.open { display: flex; }
  .annotation-toolbar .swatch {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .annotation-toolbar .del {
    width: 16px; height: 16px; border-radius: 4px; cursor: pointer;
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .canvas-viewport.placing-text { cursor: crosshair; }

  .empty-state {
    position: absolute;
    padding: 18px 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12.5px;
    width: 260px;
  }

  @keyframes cardFloat {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(2px, -3px); }
    50% { transform: translate(-2px, 1px); }
    75% { transform: translate(1px, 3px); }
  }
  figure.card {
    position: absolute;
    margin: 0;
    width: 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: grab;
    user-select: none;
    animation: cardFloat 7s ease-in-out infinite;
    transition: transform 0.18s ease, box-shadow 0.3s ease, outline-color 0.3s ease;
  }
  figure.card:hover {
    transform: scale(1.045) !important;
    z-index: 8;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  figure.card.dragging {
    cursor: grabbing;
    transform: none !important;
    animation-play-state: paused;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    z-index: 10;
  }
  figure.card.search-highlight {
    outline: 3px solid var(--accent);
    box-shadow: 0 0 24px 6px rgba(124,156,255,0.5);
  }
  .thumb-wrap { position: relative; pointer-events: none; }
  body.alt-export-mode .thumb-wrap { pointer-events: auto; }
  body.alt-export-mode figure.card { cursor: copy; }
  figure.card img, figure.card video {
    width: 100%;
    height: auto;
    max-height: 320px;
    object-fit: contain;
    display: block;
    background: #000;
  }
  figcaption {
    padding: 10px 12px 4px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
    pointer-events: none;
  }

  .select-check, .delete-x, .download-btn, .resize-handle {
    pointer-events: auto;
  }
  .download-btn {
    display: flex;
    position: absolute;
    top: 36px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    z-index: 3;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  figure.card:hover .download-btn { opacity: 1; }
  .download-btn:hover { background: var(--accent); border-color: var(--accent); color: #0e0e10; }

  .resize-handle {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 14px;
    height: 14px;
    cursor: nwse-resize;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  figure.card:hover .resize-handle, figure.card.selected .resize-handle { opacity: 0.9; }
  .resize-handle::after {
    content: '';
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 8px;
    height: 8px;
    border-right: 2px solid rgba(255,255,255,0.6);
    border-bottom: 2px solid rgba(255,255,255,0.6);
  }
  .select-check {
    display: flex;
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 2px solid rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.4);
    z-index: 3;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .select-check:hover { border-color: var(--accent); }
  figure.card.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  figure.card.selected .select-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .delete-x {
    display: flex;
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    z-index: 3;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .delete-x:hover { background: #c0392b; border-color: #c0392b; color: #fff; }

  .rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px 8px;
    gap: 8px;
    pointer-events: auto;
  }
  .stars { display: flex; gap: 2px; cursor: pointer; }
  .stars .star { font-size: 15px; color: var(--star-off); line-height: 1; }
  .stars .star.filled { color: var(--star); }
  .note-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10.5px;
    border-radius: 5px;
    padding: 3px 7px;
    cursor: pointer;
  }
  .note-btn.has-note { color: var(--accent); border-color: var(--accent); }
  .note-editor { display: none; padding: 0 12px 10px; pointer-events: auto; }
  .note-editor.open { display: block; }
  .note-editor textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px;
    font-size: 11.5px;
    font-family: inherit;
    resize: vertical;
    min-height: 44px;
  }
  .context-menu {
    display: none;
    position: fixed;
    z-index: 60;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    min-width: 190px;
    max-height: 60vh;
    overflow-y: auto;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    font-size: 12.5px;
  }
  .context-menu.open { display: block; }
  .context-menu .cm-item {
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }
  .context-menu .cm-item:hover { background: var(--accent); color: #0e0e10; }
  .context-menu .cm-item.danger:hover { background: #c0392b; color: #fff; }
  .context-menu .cm-heading {
    padding: 6px 10px 4px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .context-menu .cm-sep { height: 1px; background: var(--border); margin: 4px 2px; }

  .group-popup {
    display: none;
    position: fixed;
    z-index: 60;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    width: 240px;
  }
  .group-popup.open { display: block; }
  .group-popup-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .group-popup-row:last-child { margin-bottom: 0; }
  .group-popup input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .group-popup .preset {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .group-popup .preset.active { border-color: var(--text); }
  .group-popup input[type="color"] {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  .group-popup button {
    background: var(--accent);
    border: none;
    color: #0e0e10;
    font-weight: 600;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    flex: 1;
  }
  .group-popup button.ghost { background: none; border: 1px solid var(--border); color: var(--muted); font-weight: 400; flex: none; }

  .group-box {
    position: absolute;
    border-radius: 14px;
    pointer-events: none;
  }
  .group-resize-handle {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 16px;
    height: 16px;
    border-radius: 4px;
    cursor: nwse-resize;
    pointer-events: auto;
    background: var(--panel2);
    border: 1px solid var(--border);
    opacity: 0.7;
  }
  .group-resize-handle:hover { opacity: 1; border-color: var(--accent); }
  .group-titlebar {
    position: absolute;
    top: -38px;
    left: -1px;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
    cursor: grab;
  }
  .group-titlebar.dragging { cursor: grabbing; }
  .group-title {
    font-size: 19px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    outline: none;
    max-width: 360px;
  }
  .group-toolbar {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
  }
  .group-titlebar:hover .group-toolbar, .group-toolbar.open { display: flex; }
  .group-toolbar .swatch {
    width: 15px; height: 15px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2);
  }
  .group-toolbar .del {
    width: 15px; height: 15px; border-radius: 4px; cursor: pointer;
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 10px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 40px;
    flex-direction: column;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video {
    max-width: 94vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 4px;
  }
  #lightbox .cap { color: var(--text); margin-top: 16px; max-width: 700px; text-align: center; font-size: 14px; }
  #lightbox .cap-link {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    color: var(--accent);
    font-size: 12.5px;
    text-decoration: none;
  }
  #lightbox .cap-link.show { display: flex; }
  #lightbox .cap-link:hover { text-decoration: underline; }
  #lightbox .close { position: absolute; top: 24px; right: 32px; color: var(--muted); font-size: 28px; cursor: pointer; }

  .hover-preview {
    position: fixed;
    max-width: 46vw;
    background: rgba(23,23,26,0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: scale(0.92);
    transition: transform 0.15s ease, opacity 0.15s ease, visibility 0.15s;
  }
  .hover-preview.show { opacity: 1; visibility: visible; transform: scale(1); }
  .hp-media img, .hp-media video {
    display: block;
    max-width: min(44vw, 640px);
    max-height: 62vh;
    width: auto;
    height: auto;
    border-radius: 8px;
    object-fit: contain;
    margin: 0 auto;
    background: #000;
  }
  .hp-cap { color: var(--muted); font-size: 12.5px; margin-top: 10px; max-width: min(44vw, 640px); text-align: center; }

  .minimap-panel {
    display: none;
    position: fixed;
    top: 64px;
    right: 20px;
    z-index: 22;
    background: rgba(23,23,26,0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .minimap-panel.show { display: block; }
  #minimapCanvas { display: block; cursor: pointer; border-radius: 6px; }

  #batchBar {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    align-items: center;

// ---------- Minimap ----------
const MINIMAP_W = 180, MINIMAP_H = 130;
const minimapPanel = document.getElementById('minimapPanel');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function minimapScale() {
  const st = canvasState[activeCatId];
  const scale = Math.min(MINIMAP_W / st.worldW, MINIMAP_H / st.worldH);
  return { st, scale, offX: (MINIMAP_W - st.worldW * scale) / 2, offY: (MINIMAP_H - st.worldH * scale) / 2 };
}

function updateMinimap() {
  if (!activeCatId) { minimapPanel.classList.remove('show'); return; }
  minimapPanel.classList.add('show');
  const { st, scale, offX, offY } = minimapScale();

  minimapCtx.clearRect(0, 0, MINIMAP_W, MINIMAP_H);
  minimapCtx.fillStyle = 'rgba(255,255,255,0.04)';
  minimapCtx.fillRect(offX, offY, st.worldW * scale, st.worldH * scale);

  Object.values(groups).forEach(g => {
    if (g.deleted || g.catId !== activeCatId) return;
    minimapCtx.fillStyle = hexToRgba(g.color || '#7c9cff', 0.25);
    minimapCtx.fillRect(offX + g.x * scale, offY + g.y * scale, g.w * scale, g.h * scale);
  });

  minimapCtx.fillStyle = 'rgba(234,234,236,0.6)';
  Object.values(cardIndex).forEach(c => {
    if (c.cardEl.dataset.cat !== activeCatId || c.cardEl.style.display === 'none') return;
    const x = parseFloat(c.cardEl.style.left), y = parseFloat(c.cardEl.style.top);
    minimapCtx.fillRect(offX + x * scale, offY + y * scale, 3, 3);
  });

  const vpRect = st.viewportEl.getBoundingClientRect();
  const viewX = -st.panX / st.zoom, viewY = -st.panY / st.zoom;
  const viewW = vpRect.width / st.zoom, viewH = vpRect.height / st.zoom;
  minimapCtx.strokeStyle = '#7c9cff';
  minimapCtx.lineWidth = 1.5;
  minimapCtx.strokeRect(offX + viewX * scale, offY + viewY * scale, viewW * scale, viewH * scale);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

minimapCanvas.addEventListener('click', (e) => {
  if (!activeCatId) return;
  const { st, scale, offX, offY } = minimapScale();
  const rect = minimapCanvas.getBoundingClientRect();
  const worldX = (e.clientX - rect.left - offX) / scale;
  const worldY = (e.clientY - rect.top - offY) / scale;
  const vpRect = st.viewportEl.getBoundingClientRect();
  st.panX = vpRect.width / 2 - worldX * st.zoom;
  st.panY = vpRect.height / 2 - worldY * st.zoom;
  applyTransform(activeCatId);
});

// ---------- Big hover preview ----------
let hoverPreviewTimer = null;
const hoverPreviewEl = document.getElementById('hoverPreview');
const hpMedia = document.getElementById('hpMedia');
const hpCap = document.getElementById('hpCap');

function showHoverPreview(c) {
  if (!c) return;
  hpMedia.innerHTML = c.isVideo ? `<video src="${c.src}" muted loop autoplay playsinline></video>` : `<img src="${c.src}" alt="">`;
  hpCap.textContent = c.caption;
  positionHoverPreview(c.cardEl); // position first, while still invisible, so it never visibly jumps
  hoverPreviewEl.classList.add('show');
}

// Docks the preview beside whichever side of the card has more room, and keeps it
// vertically centered on the card, clamped so it never runs off-screen. Uses the
// panel's max-size CSS bounds rather than its real (post-image-load) size, since the
// actual media dimensions aren't known yet the instant this runs.
function positionHoverPreview(cardEl) {
  const cardRect = cardEl.getBoundingClientRect();
  const margin = 20;
  const gap = 56; // extra clearance from the card so the panel doesn't crowd the cursor
  const estW = Math.min(window.innerWidth * 0.46, 640) + 28;
  const estH = Math.min(window.innerHeight * 0.62, 640) + 60;
  const spaceRight = window.innerWidth - cardRect.right;
  const spaceLeft = cardRect.left;

  let left;
  if (spaceRight >= estW + gap || spaceRight >= spaceLeft) {
    left = Math.min(cardRect.right + gap, window.innerWidth - estW - margin);
  } else {
    left = Math.max(cardRect.left - estW - gap, margin);
  }
  let top = cardRect.top + cardRect.height / 2 - estH / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - estH - margin));

  hoverPreviewEl.style.left = left + 'px';
  hoverPreviewEl.style.top = top + 'px';
}
function hideHoverPreview() {
  hoverPreviewEl.classList.remove('show');
  hpMedia.innerHTML = '';

function isVideo(file) { return /\.(mp4|webm|mov)$/i.test(file); }
function imageId(catId, subId, file) { return `${catId}__${subId || "_"}__${file}`; }
function snap(v) { return Math.round(v / GRID_SNAP) * GRID_SNAP; }

// ---------- Search index (categories, sub-categories, and every image caption) ----------
function buildSearchIndex() {
  const items = [];
  CATEGORIES.forEach(cat => {
    items.push({ kind: 'category', title: cat.title, label: cat.title, catId: cat.id });
    const groupsArr = cat.subs || [{ id: null, title: null, folder: cat.folder, images: cat.images }];
    groupsArr.forEach(g => {
      if (g.title) {
        items.push({ kind: 'sub', title: g.title, label: `${cat.title} › ${g.title}`, catId: cat.id, subId: g.id });
      }
      g.images.forEach(img => {
        items.push({
          kind: 'image',
          title: img.caption,
          label: img.caption,
          catId: cat.id,
          subId: g.id,
          imageId: imageId(cat.id, g.id, img.file),
          breadcrumb: `${cat.title}${g.title ? ' › ' + g.title : ''}`,
        });
      });
    });
  });
  return items;
}
const SEARCH_INDEX = buildSearchIndex();

// ---------- Default cluster layout (used when an image has no saved x/y) ----------
const CARD_W = 220, CARD_H = 420, COL_GAP = 20, ROW_GAP = 30, COLS = 5, CLUSTER_GAP = 60, LABEL_H = 30; // CARD_H sized for the tallest possible thumb (max-height:320px) + caption/rating chrome, now that cards preserve real aspect ratio instead of a fixed 180px crop

function computeDefaultLayout(cat) {
  // returns { positions: {imageId: {x,y}}, zones: [{label,x,y}], worldW, worldH }
  const positions = {};
  const zones = [];
  let curY = 20;
  let maxW = 20;
  const groups = cat.subs || [{ id: null, title: null, folder: cat.folder, images: cat.images }];
  groups.forEach(group => {
    if (group.title) {
      zones.push({ label: group.title, count: group.images.length, x: 20, y: curY });
      curY += LABEL_H;
    }
    if (group.images.length === 0) {
      positions[`__empty__${cat.id}__${group.id || "_"}`] = { x: 20, y: curY, empty: true, folder: group.folder, subId: group.id };
      curY += 90 + CLUSTER_GAP;
      return;
    }
    group.images.forEach((img, i) => {
      const col = i % COLS, row = Math.floor(i / COLS);
      const id = imageId(cat.id, group.id, img.file);
      positions[id] = { x: 20 + col * (CARD_W + COL_GAP), y: curY + row * (CARD_H + ROW_GAP) };
    });
    const rows = Math.ceil(group.images.length / COLS);
    curY += rows * (CARD_H + ROW_GAP) + CLUSTER_GAP;
    maxW = Math.max(maxW, 20 + COLS * (CARD_W + COL_GAP));
  });
  return { positions, zones, worldW: maxW + 400, worldH: curY + 400 };
}

  const groups = cat.subs || [{ folder: cat.folder, images: cat.images }];
  const thumbs = [];
  for (const g of groups) {
    for (const img of g.images) {
      if (isVideo(img.file)) continue; // stick to stills for the preview collage
      thumbs.push(`images/${img.folder || g.folder}/${img.file}`);
      if (thumbs.length >= 3) return thumbs;
    }
  }
  return thumbs;
}

      for (let i = 1; i <= 5; i++) {

        s.addEventListener('click', () => setRating(id, i));
        starsEl.appendChild(s);

  canvasState[cat.id] = { panX: 0, panY: 0, zoom: 1, viewportEl: viewport, worldEl: world, placingText: false, worldW: layout.worldW, worldH: layout.worldH };
  initCanvasInteractions(cat.id);
});

// ---------- Home / category navigation ----------
let activeCatId = null;
function showHome() {
  activeCatId = null;
  document.getElementById('home').style.display = 'block';
  document.querySelectorAll('.category').forEach(el => el.classList.remove('active'));
  document.getElementById('crumb').textContent = '';
  document.getElementById('floatingToolbar').classList.remove('open');
  hideHoverPreview();
  updateMinimap();
  history.replaceState(null, '', '#');
}
function showCategory(id) {
  activeCatId = id;
  document.getElementById('home').style.display = 'none';
  document.querySelectorAll('.category').forEach(el => el.classList.toggle('active', el.id === id));
  const cat = CATEGORIES.find(c => c.id === id);
  document.getElementById('crumb').innerHTML = cat ? `›  ${ICONS[cat.icon]} ${cat.title}` : '';
  document.getElementById('floatingToolbar').classList.add('open');
  hideHoverPreview();
  updateMinimap();
  history.replaceState(null, '', `#${id}`);
}
if (location.hash && document.getElementById(location.hash.slice(1))) {
  showCategory(location.hash.slice(1));
} else {
  showHome();
}

function applyTransform(catId) {
  const st = canvasState[catId];
  st.worldEl.style.transform = `translate(${st.panX}px, ${st.panY}px) scale(${st.zoom})`;
  if (catId === activeCatId) {
    document.getElementById('ft-zoom-level').textContent = Math.round(st.zoom * 100) + '%';
    updateMinimap();
  }
}

// ---------- Canvas pan/zoom ----------
function initCanvasInteractions(catId) {
  const st = canvasState[catId];
  const vp = st.viewportEl;

  let panning = false, panStart = { x: 0, y: 0 }, panOrigin = { x: 0, y: 0 };
  let marquee = null, marqueeStart = { x: 0, y: 0 }, marqueeMoved = false;

  function worldPointFromEvent(e) {
    const rect = vp.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    return { x: (px - st.panX) / st.zoom, y: (py - st.panY) / st.zoom };
  }

  vp.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('figure.card, .annotation-wrap, .group-titlebar, .group-resize-handle')) return; // handled by drag logic below

    if (st.placingText) {
      const wp = worldPointFromEvent(e);
      createAnnotationAt(catId, Math.round(wp.x), Math.round(wp.y));
      st.placingText = false;
      vp.classList.remove('placing-text');
      return;
    }

    if (spaceHeld) {
      panning = true;
      vp.classList.add('panning');
      panStart = { x: e.clientX, y: e.clientY };
      panOrigin = { x: st.panX, y: st.panY };
      return;
    }

    // Plain drag on empty canvas = box-select (no shift needed); a plain click
    // (no movement) deselects everything, since there's nothing under a 0px marquee.
    marqueeMoved = false;
    const rect = vp.getBoundingClientRect();
    marqueeStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    marquee = document.createElement('div');
    marquee.style.position = 'absolute';
    marquee.style.border = '1px dashed var(--accent)';
    marquee.style.background = 'rgba(124,156,255,0.1)';
    marquee.style.zIndex = '5';
    marquee.style.left = marqueeStart.x + 'px';
    marquee.style.top = marqueeStart.y + 'px';
    vp.appendChild(marquee);
  });

  window.addEventListener('mousemove', (e) => {
    if (marquee) {
      const rect = vp.getBoundingClientRect();
      const curX = e.clientX - rect.left, curY = e.clientY - rect.top;
      const left = Math.min(curX, marqueeStart.x), top = Math.min(curY, marqueeStart.y);
      const w = Math.abs(curX - marqueeStart.x), h = Math.abs(curY - marqueeStart.y);
      if (w > 3 || h > 3) marqueeMoved = true;
      Object.assign(marquee.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
      return;
    }
    if (!panning) return;
    st.panX = panOrigin.x + (e.clientX - panStart.x);
    st.panY = panOrigin.y + (e.clientY - panStart.y);
    applyTransform(catId);
  });

  window.addEventListener('mouseup', (e) => {
    if (marquee) {
      const mRect = marquee.getBoundingClientRect();
      if (!marqueeMoved) {
        // Plain click on empty canvas — deselect everything.
        clearSelection();
      } else {
        let newlySelected = 0;
        Object.entries(cardIndex).forEach(([id, c]) => {
          if (c.cardEl.dataset.cat !== catId || c.cardEl.style.display === 'none') return;
          const cRect = c.cardEl.getBoundingClientRect();
          const intersects = !(cRect.right < mRect.left || cRect.left > mRect.right || cRect.bottom < mRect.top || cRect.top > mRect.bottom);
          if (intersects && !selected.has(id)) { toggleSelect(id); newlySelected++; }
        });
        if (newlySelected > 1) {
          const worldA = worldPointFromEvent({ clientX: mRect.left, clientY: mRect.top });
          const worldB = worldPointFromEvent({ clientX: mRect.right, clientY: mRect.bottom });
          openGroupPopup(catId, e.clientX, e.clientY, worldA, worldB);
        }
      }
      marquee.remove();
      marquee = null;
    }
    panning = false;
    vp.classList.remove('panning');
  });

  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // Pinch-to-zoom on a trackpad (and ctrl/cmd+scroll on a mouse) arrives as wheel
      // events with ctrlKey set — that's the browser's own signal to distinguish a
      // zoom gesture from a plain two-finger scroll, which should just pan.
      const rect = vp.getBoundingClientRect();
      const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
      const worldX = (mouseX - st.panX) / st.zoom, worldY = (mouseY - st.panY) / st.zoom;
      const factor = Math.pow(1.0025, -e.deltaY); // gentle, continuous — old flat ±10%/tick felt too fast
      st.zoom = Math.min(3, Math.max(0.3, st.zoom * factor));
      st.panX = mouseX - worldX * st.zoom;
      st.panY = mouseY - worldY * st.zoom;
    } else {
      // Two-finger trackpad drag (or a plain mouse wheel) — pan in all directions.
      st.panX -= e.deltaX;
      st.panY -= e.deltaY;
    }
    applyTransform(catId);
  }, { passive: false });

  // Dragging — images (figure.card), text annotations (.annotation-wrap) and group
  // boxes (drag via .group-titlebar, which also carries its member cards/annotations
  // along) all share this logic.
  let dragEl = null, dragKind = null, dragStart = { x: 0, y: 0 }, elStart = { x: 0, y: 0 }, moved = false, dragMembers = [];
  vp.addEventListener('mousedown', (e) => {
    if (e.altKey || e.button !== 0) return; // right-click is handled by the contextmenu listener instead
    const cardEl = e.target.closest('figure.card');
    const annEl = e.target.closest('.annotation-wrap');
    const groupTitlebar = e.target.closest('.group-titlebar');
    if (cardEl) {
      if (e.target.closest('.select-check, .delete-x, .download-btn, .resize-handle, .rating-row, .note-editor')) return;
      dragEl = cardEl; dragKind = 'card';
    } else if (annEl) {
      if (e.target.closest('.annotation-toolbar')) return;
      if (document.activeElement === annEl.querySelector('.annotation')) return; // already editing text, let cursor placement work
      dragEl = annEl; dragKind = 'annotation';
    } else if (groupTitlebar) {
      if (e.target.closest('.group-toolbar')) return;
      if (document.activeElement === groupTitlebar.querySelector('.group-title')) return;
      const box = document.querySelector(`.group-box[data-id="${groupTitlebar.dataset.id}"]`);
      if (!box) return;
      dragEl = box; dragKind = 'group';
      // Snapshot which cards/annotations currently sit inside the group's bounds
      // (by center point) so they move along with it.
      const gx = parseFloat(box.style.left), gy = parseFloat(box.style.top);
      const gw = parseFloat(box.style.width), gh = parseFloat(box.style.height);
      dragMembers = [];
      Object.entries(cardIndex).forEach(([mid, c]) => {
        if (c.cardEl.dataset.cat !== catId) return;
        const cx = parseFloat(c.cardEl.style.left), cy = parseFloat(c.cardEl.style.top);
        const centerX = cx + c.cardEl.offsetWidth / 2, centerY = cy + c.cardEl.offsetHeight / 2;
        if (centerX >= gx && centerX <= gx + gw && centerY >= gy && centerY <= gy + gh) {
          dragMembers.push({ type: 'card', id: mid, el: c.cardEl, startX: cx, startY: cy });
        }
      });
      Object.entries(annotationIndex).forEach(([mid, a]) => {
        if (a.el.dataset.cat !== catId) return;
        const ax = parseFloat(a.el.style.left), ay = parseFloat(a.el.style.top);
        if (ax >= gx && ax <= gx + gw && ay >= gy && ay <= gy + gh) {
          dragMembers.push({ type: 'annotation', id: mid, el: a.el, startX: ax, startY: ay });
        }
      });
    } else {
      return;
    }
    moved = false;
    dragStart = { x: e.clientX, y: e.clientY };
    elStart = { x: parseFloat(dragEl.style.left), y: parseFloat(dragEl.style.top) };
    e.stopPropagation();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragEl) return;
    const dx = (e.clientX - dragStart.x) / st.zoom;
    const dy = (e.clientY - dragStart.y) / st.zoom;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      moved = true;
      dragEl.classList.add('dragging');
      if (dragKind === 'group') dragEl.querySelector('.group-titlebar').classList.add('dragging');
    }
    if (moved) {
      dragEl.style.left = snap(elStart.x + dx) + 'px';
      dragEl.style.top = snap(elStart.y + dy) + 'px';
      dragMembers.forEach(m => {
        m.el.style.left = snap(m.startX + dx) + 'px';
        m.el.style.top = snap(m.startY + dy) + 'px';
      });
    }
  });
  window.addEventListener('mouseup', (e) => {
    if (!dragEl) return;
    const id = dragEl.dataset.id;
    const x = parseFloat(dragEl.style.left), y = parseFloat(dragEl.style.top);
    if (moved) {
      dragEl.classList.remove('dragging');
      if (dragKind === 'card') {
        persistPosition(id, x, y);
      } else if (dragKind === 'annotation') {
        persistAnnotation(id, { x, y });
      } else if (dragKind === 'group') {
        dragEl.querySelector('.group-titlebar').classList.remove('dragging');
        persistGroup(id, { x, y });
        dragMembers.forEach(m => {
          const mx = parseFloat(m.el.style.left), my = parseFloat(m.el.style.top);
          if (m.type === 'card') persistPosition(m.id, mx, my);
          else persistAnnotation(m.id, { x: mx, y: my });
        });
      }
    } else if (dragKind === 'card') {
      const c = cardIndex[id];
      if (c) openLightbox(c.src, c.caption, c.isVideo, c.url);
    } else if (dragKind === 'annotation') {
      annotationIndex[id].textEl.focus();
    } else if (dragKind === 'group') {
      groupIndex[id].titleEl.focus();
    }
    dragEl = null; dragKind = null; dragMembers = [];
    updateMinimap();
  });

  // Resizing a card — drag its corner handle to change width; height follows via the
  // media's own aspect ratio (object-fit:contain + height:auto on the <img>/<video>).
  let resizeEl = null, resizeStartX = 0, resizeStartW = 0;
  vp.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const handle = e.target.closest('.resize-handle');
    if (!handle) return;
    resizeEl = handle.closest('figure.card');
    resizeStartX = e.clientX;
    resizeStartW = resizeEl.getBoundingClientRect().width / st.zoom;
    e.stopPropagation();
  });
  window.addEventListener('mousemove', (e) => {
    if (!resizeEl) return;
    const dx = (e.clientX - resizeStartX) / st.zoom;
    resizeEl.style.width = Math.max(120, Math.min(640, resizeStartW + dx)) + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!resizeEl) return;
    persistSize(resizeEl.dataset.id, parseFloat(resizeEl.style.width));
    resizeEl = null;
  });

  // Resizing a group — its own corner handle scales the box AND every card inside it
  // proportionally (both position and size), like resizing a group in Figma/PowerPoint.
  let resizeGroupEl = null, resizeGroupStart = null, resizeGroupMembers = [];
  vp.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const handle = e.target.closest('.group-resize-handle');
    if (!handle) return;
    resizeGroupEl = handle.closest('.group-box');
    const gx = parseFloat(resizeGroupEl.style.left), gy = parseFloat(resizeGroupEl.style.top);
    const gw = parseFloat(resizeGroupEl.style.width), gh = parseFloat(resizeGroupEl.style.height);
    resizeGroupStart = { x: gx, y: gy, w: gw, h: gh, mouseX: e.clientX, mouseY: e.clientY };
    resizeGroupMembers = [];
    Object.entries(cardIndex).forEach(([mid, c]) => {
      if (c.cardEl.dataset.cat !== catId) return;
      const cx = parseFloat(c.cardEl.style.left), cy = parseFloat(c.cardEl.style.top);
      const cw = c.cardEl.offsetWidth;
      const centerX = cx + cw / 2, centerY = cy + c.cardEl.offsetHeight / 2;
      if (centerX >= gx && centerX <= gx + gw && centerY >= gy && centerY <= gy + gh) {
        resizeGroupMembers.push({ id: mid, el: c.cardEl, relX: cx - gx, relY: cy - gy, startW: cw });
      }
    });
    e.stopPropagation();
  });
  window.addEventListener('mousemove', (e) => {
    if (!resizeGroupEl) return;
    const dx = (e.clientX - resizeGroupStart.mouseX) / st.zoom;
    const dy = (e.clientY - resizeGroupStart.mouseY) / st.zoom;
    const newW = Math.max(160, resizeGroupStart.w + dx);
    const newH = Math.max(120, resizeGroupStart.h + dy);
    const scaleX = newW / resizeGroupStart.w;
    const scaleY = newH / resizeGroupStart.h;
    const scale = Math.min(scaleX, scaleY); // uniform card scale so individual cards never distort
    resizeGroupEl.style.width = newW + 'px';
    resizeGroupEl.style.height = newH + 'px';
    resizeGroupMembers.forEach(m => {
      m.el.style.left = snap(resizeGroupStart.x + m.relX * scaleX) + 'px';
      m.el.style.top = snap(resizeGroupStart.y + m.relY * scaleY) + 'px';
      m.el.style.width = Math.max(120, Math.min(640, m.startW * scale)) + 'px';
    });
  });
  window.addEventListener('mouseup', () => {
    if (!resizeGroupEl) return;
    const id = resizeGroupEl.dataset.id;
    persistGroup(id, { w: parseFloat(resizeGroupEl.style.width), h: parseFloat(resizeGroupEl.style.height) });
    resizeGroupMembers.forEach(m => {
      persistPosition(m.id, parseFloat(m.el.style.left), parseFloat(m.el.style.top));
      persistSize(m.id, parseFloat(m.el.style.width));
    });
    resizeGroupEl = null; resizeGroupMembers = [];
    updateMinimap();
  });
}

// "Organize": pack every visible card into a dense grid (no leftover gaps),
// ordered to roughly match current position (reading order: top-to-bottom, left-to-right)
// so relative arrangement is preserved even though spacing is fully compacted.
function organize(catId) {
  const cellW = CARD_W + COL_GAP, cellH = CARD_H + ROW_GAP;
  const cards = Object.entries(cardIndex).filter(([id, c]) => c.cardEl.dataset.cat === catId && c.cardEl.style.display !== 'none');
  if (!cards.length) return;

  const withPos = cards.map(([id, c]) => ({
    id, c,
    x: parseFloat(c.cardEl.style.left),
    y: parseFloat(c.cardEl.style.top),
  }));
  // Band into rows using half a card-height as tolerance, so near-aligned rows sort cleanly
  // even if not pixel-perfect, then order left-to-right within each row.
  const rowBand = CARD_H / 2;
  withPos.sort((a, b) => {
    const bandA = Math.round(a.y / rowBand), bandB = Math.round(b.y / rowBand);
    return bandA - bandB || a.x - b.x;
  });

  const originX = 20, originY = 20;
  withPos.forEach((item, i) => {
    const col = i % COLS, row = Math.floor(i / COLS);
    const x = originX + col * cellW, y = originY + row * cellH;
    item.c.cardEl.style.left = x + 'px';
    item.c.cardEl.style.top = y + 'px';
    persistPosition(item.id, x, y);
  });
}

// ---------- Lightbox ----------
const lightbox = document.getElementById('lightbox');
const lightboxMedia = document.getElementById('lightbox-media');
const lightboxCap = document.getElementById('lightbox-cap');
const lightboxLink = document.getElementById('lightbox-link');

function openLightbox(src, cap, video, url) {
  lightboxMedia.innerHTML = video ? `<video src="${src}" controls autoplay loop></video>` : `<img src="${src}" alt="">`;
  lightboxCap.textContent = cap;
  if (url) {
    lightboxLink.href = url;
    lightboxLink.innerHTML = `${ICONS.link} View source`;
    lightboxLink.classList.add('show');
  } else {
    lightboxLink.classList.remove('show');
  }
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) { lightbox.classList.remove('open'); lightboxMedia.innerHTML = ''; }
});
document.querySelector('#lightbox .close').addEventListener('click', () => {
  lightbox.classList.remove('open'); lightboxMedia.innerHTML = '';
});

// ---------- Ratings backend ----------
function renderStars(id) {
  const rec = ratings[id];
  const stars = rec ? rec.stars : 0;
  const { starsEl, noteBtn, textarea } = cardIndex[id];
  [...starsEl.children].forEach((s, i) => s.classList.toggle('filled', i < stars));
  if (rec && rec.note) { noteBtn.classList.add('has-note'); textarea.value = rec.note; }
  else { noteBtn.classList.remove('has-note'); }
}

async function fetchRatings() {
  try {
    const res = await fetch(RATINGS_API);
    ratings = await res.json();
  } catch (e) {
    console.warn('Could not load ratings', e);
    ratings = {};
  }
  Object.keys(cardIndex).forEach(id => {
    const rec = ratings[id];
    if (rec && (rec.deleted || rec.movedTo)) {
      removeCard(id);
    } else {
      renderStars(id);
      if (rec && typeof rec.x === 'number' && typeof rec.y === 'number') {
        cardIndex[id].cardEl.style.left = rec.x + 'px';
        cardIndex[id].cardEl.style.top = rec.y + 'px';
      }
      if (rec && typeof rec.w === 'number') {
        cardIndex[id].cardEl.style.width = rec.w + 'px';
      }
    }
  });
  updateTileCounts();
  updateMinimap();
}

function updateTileCounts() {
  CATEGORIES.forEach(cat => {
    const remaining = Object.values(cardIndex).filter(c => c.cardEl.dataset.cat === cat.id).length;
    const tile = document.querySelector(`.category-tile[data-cat="${cat.id}"] .tile-count`);
    if (tile) tile.textContent = `${remaining} images`;
  });
}

// ---------- Text annotations ----------
async function fetchAnnotations() {
  try {
    const res = await fetch(ANNOTATIONS_API);
    annotations = await res.json();
  } catch (e) {
    console.warn('Could not load annotations', e);
    annotations = {};
  }
  Object.entries(annotations).forEach(([id, rec]) => {
    if (rec.deleted) return;
    const world = canvasState[rec.catId] && canvasState[rec.catId].worldEl;
    if (world) renderAnnotationEl(id, rec, world);
  });
}

function renderAnnotationEl(id, rec, world) {
  const wrap = document.createElement('div');
  wrap.className = 'annotation-wrap';
  wrap.style.position = 'absolute';
  wrap.style.left = rec.x + 'px';
  wrap.style.top = rec.y + 'px';
  wrap.dataset.id = id;
  wrap.dataset.cat = rec.catId;

  const toolbar = document.createElement('div');
  toolbar.className = 'annotation-toolbar';
  toolbar.addEventListener('mousedown', (e) => e.stopPropagation());
  ANNOTATION_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.addEventListener('click', () => { el.style.color = c; persistAnnotation(id, { color: c }); });
    toolbar.appendChild(sw);
  });
  const del = document.createElement('button');
  del.className = 'del';
  del.innerHTML = ICONS.x;
  del.addEventListener('click', () => {
    persistAnnotation(id, { deleted: true });
    wrap.remove();
    delete annotationIndex[id];
  });
  toolbar.appendChild(del);
  wrap.appendChild(toolbar);

  const el = document.createElement('div');
  el.className = 'annotation';
  el.contentEditable = 'true';
  el.textContent = rec.text || 'New label';
  el.style.color = rec.color || '#eaeaec';
  el.style.left = '0';
  el.style.top = '0';
  el.style.position = 'relative';
  el.addEventListener('focus', () => toolbar.classList.add('open'));
  el.addEventListener('blur', () => {
    toolbar.classList.remove('open');
    persistAnnotation(id, { text: el.textContent });
  });
  wrap.appendChild(el);

  world.appendChild(wrap);
  annotationIndex[id] = { el: wrap, textEl: el, toolbarEl: toolbar };
  return wrap;
}

async function persistAnnotation(id, extra) {
  const current = annotations[id] || { catId: extra.catId, text: '', color: '#eaeaec', x: 40, y: 40 };
  annotations[id] = { ...current, ...extra };
  const body = { annotationId: id, catId: annotations[id].catId, text: annotations[id].text, color: annotations[id].color, x: annotations[id].x, y: annotations[id].y, deleted: !!annotations[id].deleted, ...extra };
  try {
    await fetch(ANNOTATIONS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify(body)
    });
  } catch (e) {
    console.warn('Could not save annotation', e);
  }
}

function createAnnotationAt(catId, x, y) {
  const id = 'ann-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const rec = { catId, text: 'New label', color: '#eaeaec', x, y, deleted: false };
  annotations[id] = rec;
  const world = canvasState[catId].worldEl;
  const wrap = renderAnnotationEl(id, rec, world);
  persistAnnotation(id, {});
  const textEl = wrap.querySelector('.annotation');
  textEl.focus();
  document.execCommand('selectAll', false, null);
}

// ---------- Groups (soft-glow bounding boxes) ----------
async function fetchGroups() {
  try {
    const res = await fetch(GROUPS_API);
    groups = await res.json();
  } catch (e) {
    console.warn('Could not load groups', e);
    groups = {};
  }
  Object.entries(groups).forEach(([id, rec]) => {
    if (rec.deleted) return;
    const world = canvasState[rec.catId] && canvasState[rec.catId].worldEl;
    if (world) renderGroupEl(id, rec, world);
  });
  updateMinimap();
}

function applyGroupColor(box, color) {
  box.style.border = `1.5px solid ${color}99`;
  box.style.background = `${color}14`;
  box.style.boxShadow = `0 0 40px 6px ${color}33, inset 0 0 30px ${color}14`;
}

function renderGroupEl(id, rec, world) {
  const box = document.createElement('div');
  box.className = 'group-box';
  box.dataset.id = id;
  box.dataset.cat = rec.catId;
  box.style.left = rec.x + 'px';
  box.style.top = rec.y + 'px';
  box.style.width = rec.w + 'px';
  box.style.height = rec.h + 'px';
  applyGroupColor(box, rec.color);

  const titlebar = document.createElement('div');
  titlebar.className = 'group-titlebar';
  titlebar.dataset.id = id;

  const title = document.createElement('div');
  title.className = 'group-title';
  title.contentEditable = 'true';
  title.textContent = rec.title || 'Group';
  title.style.color = rec.color;
  title.style.background = rec.color + '22';
  title.addEventListener('mousedown', (e) => e.stopPropagation());
  title.addEventListener('blur', () => persistGroup(id, { title: title.textContent }));
  titlebar.appendChild(title);

  const toolbar = document.createElement('div');
  toolbar.className = 'group-toolbar';
  toolbar.addEventListener('mousedown', (e) => e.stopPropagation());
  GROUP_COLOR_PRESETS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.addEventListener('click', () => {
      applyGroupColor(box, c);
      title.style.color = c;
      title.style.background = c + '22';
      persistGroup(id, { color: c });
    });
    toolbar.appendChild(sw);
  });
  const del = document.createElement('button');
  del.className = 'del';
  del.innerHTML = ICONS.x;
  del.addEventListener('click', () => {
    persistGroup(id, { deleted: true });
    box.remove();
    delete groupIndex[id];
    updateMinimap();
  });
  toolbar.appendChild(del);
  titlebar.appendChild(toolbar);

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'group-resize-handle';
  resizeHandle.title = 'Drag to resize — contents scale to fit';

  box.appendChild(titlebar);
  box.appendChild(resizeHandle);
  world.insertBefore(box, world.firstChild); // paint behind cards/annotations
  groupIndex[id] = { el: box, titleEl: title, titlebarEl: titlebar };
  return box;
}

async function persistGroup(id, extra) {
  const current = groups[id] || { catId: extra.catId, title: 'Group', color: '#7c9cff', x: 0, y: 0, w: 300, h: 200 };
  groups[id] = { ...current, ...extra };
  const body = { groupId: id, catId: groups[id].catId, title: groups[id].title, color: groups[id].color, x: groups[id].x, y: groups[id].y, w: groups[id].w, h: groups[id].h, deleted: !!groups[id].deleted, ...extra };
  try {
    await fetch(GROUPS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify(body)
    });
  } catch (e) {
    console.warn('Could not save group', e);
  }
}

function createGroupAt(catId, x, y, w, h, title, color) {
  const id = 'grp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const rec = { catId, title, color, x, y, w, h, deleted: false };
  groups[id] = rec;
  const world = canvasState[catId].worldEl;
  renderGroupEl(id, rec, world);
  persistGroup(id, {});
  updateMinimap();
  return id;
}

// ---------- "Create a group?" popup (offered after a box-select that catches 2+ cards) ----------
const groupPopup = document.getElementById('groupPopup');
const groupTitleInput = document.getElementById('groupTitleInput');
const groupColorPresetsEl = document.getElementById('groupColorPresets');
const groupColorCustom = document.getElementById('groupColorCustom');
let pendingGroup = null;
let pendingGroupColor = GROUP_COLOR_PRESETS[0];

GROUP_COLOR_PRESETS.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'preset' + (i === 0 ? ' active' : '');
  sw.style.background = c;
  sw.dataset.color = c;
  sw.addEventListener('click', () => {
    pendingGroupColor = c;
    groupColorCustom.value = c;
    [...groupColorPresetsEl.children].forEach(el => el.classList.toggle('active', el.dataset.color === c));
  });
  groupColorPresetsEl.appendChild(sw);
});
groupColorCustom.addEventListener('input', () => {
  pendingGroupColor = groupColorCustom.value;
  [...groupColorPresetsEl.children].forEach(el => el.classList.remove('active'));
});

function openGroupPopup(catId, clientX, clientY, worldA, worldB) {
  const pad = 24;
  pendingGroup = {
    catId,
    x: Math.min(worldA.x, worldB.x) - pad,
    y: Math.min(worldA.y, worldB.y) - pad,
    w: Math.abs(worldB.x - worldA.x) + pad * 2,
    h: Math.abs(worldB.y - worldA.y) + pad * 2,
  };
  groupTitleInput.value = '';
  pendingGroupColor = GROUP_COLOR_PRESETS[0];
  groupColorCustom.value = pendingGroupColor;
  [...groupColorPresetsEl.children].forEach((el, i) => el.classList.toggle('active', i === 0));

  groupPopup.classList.add('open');
  const popupRect = groupPopup.getBoundingClientRect();
  groupPopup.style.left = Math.min(clientX, window.innerWidth - popupRect.width - 8) + 'px';
  groupPopup.style.top = Math.min(clientY, window.innerHeight - popupRect.height - 8) + 'px';
  groupTitleInput.focus();
}

function closeGroupPopup() {
  groupPopup.classList.remove('open');
  pendingGroup = null;
}

document.getElementById('groupCreateBtn').addEventListener('click', () => {
  if (!pendingGroup) return;
  const title = groupTitleInput.value.trim() || 'Group';
  createGroupAt(pendingGroup.catId, pendingGroup.x, pendingGroup.y, pendingGroup.w, pendingGroup.h, title, pendingGroupColor);
  closeGroupPopup();
});
document.getElementById('groupSkipBtn').addEventListener('click', closeGroupPopup);
window.addEventListener('mousedown', (e) => {
  if (groupPopup.classList.contains('open') && !e.target.closest('.group-popup')) closeGroupPopup();
});

// ---------- Hold Space to pan (plain drag is box-select instead) ----------
let spaceHeld = false;
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !isTypingTarget(e.target)) {
    spaceHeld = true;
    document.body.classList.add('space-pan-mode');
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    spaceHeld = false;
    document.body.classList.remove('space-pan-mode');
  }
});

function isTypingTarget(el) {
  return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable;
}

// ---------- Hotkeys (Figma-style) ----------
window.addEventListener('keydown', (e) => {
  if (isTypingTarget(e.target)) return;

  if (e.key === 'Escape') {
    clearSelection();
    closeContextMenu();
    closeGroupPopup();
    if (activeCatId) {
      const st = canvasState[activeCatId];
      st.placingText = false;
      st.viewportEl.classList.remove('placing-text');
    }
    return;
  }

  if ((e.key === 'Delete' || e.key === 'Backspace') && selected.size) {
    e.preventDefault();
    [...selected].forEach(id => deleteImage(id));
    return;
  }

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
    if (!activeCatId) return;
    e.preventDefault();
    Object.entries(cardIndex).forEach(([id, c]) => {
      if (c.cardEl.dataset.cat === activeCatId && c.cardEl.style.display !== 'none' && !selected.has(id)) toggleSelect(id);
    });
    return;
  }

  if (!activeCatId) return;
  const st = canvasState[activeCatId];

  if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    st.placingText = true;
    st.viewportEl.classList.add('placing-text');
    return;
  }

  if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    st.zoom = Math.min(3, st.zoom * 1.2);
    applyTransform(activeCatId);
    return;
  }
  if (e.key === '-' || e.key === '_') {
    e.preventDefault();
    st.zoom = Math.max(0.3, st.zoom / 1.2);
    applyTransform(activeCatId);
    return;
  }
  if (e.shiftKey && e.code === 'Digit0') { // Shift+0, keycode-based so it works across keyboard layouts
    st.panX = 0; st.panY = 0; st.zoom = 1;
    applyTransform(activeCatId);
    return;
  }
});

async function postRecord(id, extra) {
  const current = ratings[id] || { stars: 0, note: '' };
  const body = { imageId: id, stars: current.stars || 0, note: current.note || '', ...extra };
  try {
    await fetch(RATINGS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify(body)
    });
  } catch (e) {
    console.warn('Could not save', e);
  }
}

function setRating(id, stars) {
  const current = ratings[id];
  const newStars = current && current.stars === stars ? 0 : stars;
  ratings[id] = { ...(current || {}), stars: newStars, updatedAt: new Date().toISOString() };
  renderStars(id);
  postRecord(id, { stars: newStars });
}

function setNote(id, note) {
  const current = ratings[id] || { stars: 0 };
  ratings[id] = { ...current, note, updatedAt: new Date().toISOString() };
  renderStars(id);
  postRecord(id, { note });
}

function persistPosition(id, x, y) {
  ratings[id] = { ...(ratings[id] || { stars: 0, note: '' }), x, y };
  postRecord(id, { x, y });
}

function persistSize(id, w) {
  ratings[id] = { ...(ratings[id] || { stars: 0, note: '' }), w };
  postRecord(id, { w });
}

function downloadFile(src, filename) {
  const a = document.createElement('a');
  a.href = src;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function removeCard(id) {
  const entry = cardIndex[id];
  if (!entry) return;
  entry.cardEl.remove();
  delete cardIndex[id];
  selected.delete(id);
  updateBatchBar();
  updateTileCounts();
  updateMinimap();
}

async function deleteImage(id) {
  ratings[id] = { ...(ratings[id] || { stars: 0, note: '' }), deleted: true };
  removeCard(id);
  postRecord(id, { deleted: true });
}

async function moveImage(id, destValue) {
  ratings[id] = { ...(ratings[id] || { stars: 0, note: '' }), movedTo: destValue };
  removeCard(id);
  postRecord(id, { movedTo: destValue });
}

// ---------- Right-click context menu ----------
const contextMenu = document.getElementById('contextMenu');

function closeContextMenu() { contextMenu.classList.remove('open'); }

function openCardContextMenu(clientX, clientY, id, catId, groupId) {
  // Right-clicking a card that's already part of a multi-selection acts on the whole
  // selection; right-clicking anything else selects just that card first.
  if (!selected.has(id)) {
    clearSelection();
    toggleSelect(id);
  }
  const targetIds = [...selected];
  const currentDest = `${catId}__${groupId || "_"}`;

  contextMenu.innerHTML = '';
  const addItem = (label, onClick, danger) => {
    const item = document.createElement('div');
    item.className = 'cm-item' + (danger ? ' danger' : '');
    item.textContent = label;
    item.addEventListener('click', () => { onClick(); closeContextMenu(); });
    contextMenu.appendChild(item);
  };

  addItem(targetIds.length > 1 ? `Download ${targetIds.length} files` : 'Download', () => {
    targetIds.forEach((tid, i) => {
      const entry = cardIndex[tid];
      if (entry) setTimeout(() => downloadFile(entry.src, entry.src.split('/').pop()), i * 200);
    });
  });

  const sep1 = document.createElement('div');
  sep1.className = 'cm-sep';
  contextMenu.appendChild(sep1);

  const heading = document.createElement('div');
  heading.className = 'cm-heading';
  heading.textContent = 'Move to';
  contextMenu.appendChild(heading);
  DEST_OPTIONS
    .filter(d => targetIds.length > 1 || d.value !== currentDest)
    .forEach(d => addItem(d.label, () => targetIds.forEach(tid => moveImage(tid, d.value))));

  const sep2 = document.createElement('div');
  sep2.className = 'cm-sep';
  contextMenu.appendChild(sep2);

  addItem(targetIds.length > 1 ? `Delete ${targetIds.length} images` : 'Delete', () => {
    targetIds.forEach(tid => deleteImage(tid));
  }, true);

  contextMenu.classList.add('open');
  const menuRect = contextMenu.getBoundingClientRect();
  const x = Math.min(clientX, window.innerWidth - menuRect.width - 8);
  const y = Math.min(clientY, window.innerHeight - menuRect.height - 8);
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
}

window.addEventListener('mousedown', (e) => {
  if (!e.target.closest('.context-menu')) closeContextMenu();
  clearTimeout(hoverPreviewTimer);
  hideHoverPreview();
});
window.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('figure.card')) closeContextMenu();
});

// ---------- Batch select & rate ----------
const batchBar = document.getElementById('batchBar');
const batchCount = document.getElementById('batchCount');
const batchStars = document.getElementById('batchStars');
const clearSelectionBtn = document.getElementById('clearSelection');

function toggleSelect(id) {
  if (!cardIndex[id]) return;
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  cardIndex[id].cardEl.classList.toggle('selected', selected.has(id));
  cardIndex[id].checkEl.innerHTML = selected.has(id) ? ICONS.check : '';
  updateBatchBar();
}
function updateBatchBar() {
  batchCount.textContent = `${selected.size} selected`;
  batchBar.classList.toggle('open', selected.size > 0);
}
function clearSelection() {
  selected.forEach(id => {
    if (cardIndex[id]) { cardIndex[id].cardEl.classList.remove('selected'); cardIndex[id].checkEl.innerHTML = ''; }
  });
  selected.clear();
  updateBatchBar();
}
clearSelectionBtn.addEventListener('click', clearSelection);
[...batchStars.children].forEach(starEl => {
  const val = parseInt(starEl.dataset.value, 10);
  starEl.addEventListener('mouseenter', () => [...batchStars.children].forEach(s => s.classList.toggle('hover', parseInt(s.dataset.value, 10) <= val)));
  starEl.addEventListener('mouseleave', () => [...batchStars.children].forEach(s => s.classList.remove('hover')));
  starEl.addEventListener('click', () => { selected.forEach(id => setRating(id, val)); clearSelection(); });
});

document.getElementById('newCategoryBtn').addEventListener('click', () => {
  const name = prompt('Name for the new category:');
  if (!name || !name.trim()) return;
  const ids = [...selected];
  ids.forEach(id => {
    ratings[id] = { ...(ratings[id] || { stars: 0, note: '' }), pendingNewCategory: name.trim() };
    postRecord(id, { pendingNewCategory: name.trim() });
    removeCard(id);
  });
  clearSelection();
  alert(`Marked ${ids.length} image(s) for a new "${name.trim()}" category. They're hidden for now — let Claude know and it'll build the real category and move them in.`);
});

// ---------- Global search: live suggestions + jump-to-result, inline autofill for style/category names ----------
const globalSearchInput = document.getElementById('globalSearch');
const searchDropdown = document.getElementById('searchDropdown');
const searchGhostTyped = document.querySelector('#searchGhost .typed');
const searchGhostSuggest = document.querySelector('#searchGhost .suggest');

function searchMatches(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const scored = [];
  SEARCH_INDEX.forEach(item => {
    let hay = item.label.toLowerCase();
    if (item.kind === 'image') {
      const note = (ratings[item.imageId] && ratings[item.imageId].note) || '';
      hay += ' ' + note.toLowerCase();
    }
    const idx = hay.indexOf(q);
    if (idx !== -1) scored.push({ item, score: idx === 0 ? 0 : (item.kind === 'image' ? 2 : 1) });
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 8).map(s => s.item);
}

function topGhostCompletion(query) {
  const q = query.trim();
  if (!q) return '';
  const hit = SEARCH_INDEX.find(item => (item.kind === 'category' || item.kind === 'sub') && item.title.toLowerCase().startsWith(q.toLowerCase()));
  return hit ? hit.title.slice(q.length) : '';
}

function renderSearchDropdown(items) {
  searchDropdown.innerHTML = '';
  if (!items.length) { searchDropdown.classList.remove('open'); return; }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'search-row';
    if (item.kind === 'image') {
      row.innerHTML = `<span class="sr-thumb-icon">${ICONS.image}</span><div class="sr-text"><div class="sr-title">${item.title}</div><div class="sr-sub">${item.breadcrumb}</div></div>`;
    } else {
      row.innerHTML = `<span class="sr-thumb-icon">${ICONS.folder}</span><div class="sr-text"><div class="sr-title">${item.label}</div></div>`;
    }
    row.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus so the click isn't lost to the input's blur
    row.addEventListener('click', () => goToSearchResult(item));
    searchDropdown.appendChild(row);
  });
  searchDropdown.classList.add('open');
}

function resetSearchUI() {
  globalSearchInput.value = '';
  searchDropdown.classList.remove('open');
  searchDropdown.innerHTML = '';
  searchGhostTyped.textContent = '';
  searchGhostSuggest.textContent = '';
}

function goToSearchResult(item) {
  showCategory(item.catId);
  resetSearchUI();
  globalSearchInput.blur();

  if (item.kind === 'image') {
    const c = cardIndex[item.imageId];
    if (!c) return;
    const st = canvasState[item.catId];
    const cx = parseFloat(c.cardEl.style.left) + c.cardEl.offsetWidth / 2;
    const cy = parseFloat(c.cardEl.style.top) + c.cardEl.offsetHeight / 2;
    const vpRect = st.viewportEl.getBoundingClientRect();
    st.zoom = 1;
    st.panX = vpRect.width / 2 - cx;
    st.panY = vpRect.height / 2 - cy;
    applyTransform(item.catId);
    c.cardEl.classList.add('search-highlight');
    setTimeout(() => c.cardEl.classList.remove('search-highlight'), 1600);
  }
}

globalSearchInput.addEventListener('input', () => {
  const q = globalSearchInput.value;
  renderSearchDropdown(searchMatches(q));
  searchGhostTyped.textContent = q;
  searchGhostSuggest.textContent = topGhostCompletion(q);
});

globalSearchInput.addEventListener('keydown', (e) => {
  if ((e.key === 'Tab' || e.key === 'ArrowRight') && searchGhostSuggest.textContent) {
    e.preventDefault();
    globalSearchInput.value += searchGhostSuggest.textContent;
    searchGhostTyped.textContent = globalSearchInput.value;
    searchGhostSuggest.textContent = '';
    renderSearchDropdown(searchMatches(globalSearchInput.value));
    return;
  }
  if (e.key === 'Enter') {
    const matches = searchMatches(globalSearchInput.value);
    if (matches.length) goToSearchResult(matches[0]);
    return;
  }
  if (e.key === 'Escape') {
    resetSearchUI();
    globalSearchInput.blur();
  }
});
globalSearchInput.addEventListener('focus', () => {
  if (globalSearchInput.value) renderSearchDropdown(searchMatches(globalSearchInput.value));
});
globalSearchInput.addEventListener('blur', () => {
  setTimeout(() => searchDropdown.classList.remove('open'), 150);
});
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && !isTypingTarget(e.target)) {
    e.preventDefault();
    globalSearchInput.focus();
  }
});

fetchRatings();
fetchAnnotations();
fetchGroups();
</script>
