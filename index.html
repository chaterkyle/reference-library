<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Library</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #17171a;
    --panel2: #1d1d21;
    --border: #2a2a2e;
    --text: #eaeaec;
    --muted: #9a9aa0;
    --accent: #7c9cff;
    --star: #f5c542;
    --star-off: #3a3a3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 40px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,14,16,0.94);
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  header > p { margin: 0; color: var(--muted); font-size: 13px; }

  nav#catnav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  nav#catnav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    white-space: nowrap;
  }
  nav#catnav a:hover { color: var(--text); border-color: var(--accent); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .toolbar input[type="text"] {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 220px;
  }
  .toolbar select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .toolbar label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  main { padding: 8px 40px 100px; }

  .category { margin-top: 44px; }
  .category > h2 {
    font-size: 20px;
    margin: 0;
    scroll-margin-top: 190px;
  }
  .category > p.desc {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  section.sub { margin-top: 26px; scroll-margin-top: 190px; }
  section.sub h3 {
    font-size: 15px;
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    color: var(--text);
  }
  section.sub h3 .count { font-size: 12px; color: var(--muted); font-weight: 400; }

  .empty-state {
    margin-top: 10px;
    padding: 18px 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  figure.card {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  figure.card.hidden { display: none; }
  .thumb-wrap { cursor: pointer; }
  figure.card img, figure.card video {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #000;
  }
  figcaption {
    padding: 10px 12px 4px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    flex: 1;
  }

  .rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px 10px;
    gap: 8px;
  }
  .stars { display: flex; gap: 2px; cursor: pointer; }
  .stars .star {
    font-size: 16px;
    color: var(--star-off);
    line-height: 1;
    user-select: none;
  }
  .stars .star.filled { color: var(--star); }
  .note-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .note-btn.has-note { color: var(--accent); border-color: var(--accent); }
  .note-editor {
    display: none;
    padding: 0 12px 12px;
  }
  .note-editor.open { display: block; }
  .note-editor textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
  }
  .note-editor .save-hint {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  select.move-select {
    width: calc(100% - 24px);
    margin: 0 12px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 6px;
    border-radius: 5px;
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 40px;
    flex-direction: column;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video {
    max-width: 100%;
    max-height: 74vh;
    object-fit: contain;
    border-radius: 4px;
  }
  #lightbox .cap {
    color: var(--text);
    margin-top: 16px;
    max-width: 700px;
    text-align: center;
    font-size: 14px;
  }
  #lightbox .close {
    position: absolute;
    top: 24px;
    right: 32px;
    color: var(--muted);
    font-size: 28px;
    cursor: pointer;
  }

  .thumb-wrap { position: relative; }
  .select-check {
    display: flex;
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 2px solid rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.4);
    z-index: 3;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .select-check:hover { border-color: var(--accent); }
  figure.card.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  figure.card.selected .select-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .delete-x {
    display: flex;
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    z-index: 3;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .delete-x:hover {
    background: #c0392b;
    border-color: #c0392b;
    color: #fff;
  }

  #batchBar {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 50;
    font-size: 13px;
  }
  #batchBar.open { display: flex; }
  #batchBar .stars-batch { display: flex; gap: 4px; cursor: pointer; }
  #batchBar .stars-batch span { font-size: 20px; color: var(--star-off); }
  #batchBar .stars-batch span:hover, #batchBar .stars-batch span.hover { color: var(--star); }
  #batchBar button.clear-sel {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Reference Library</h1>
  <p>Motion design reference, organized by category → style. Star what's useful, note why, filter later.</p>
  <nav id="catnav"></nav>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search captions & notes…">
    <label>Min rating
      <select id="minRating">
        <option value="0">Any</option>
        <option value="1">★ 1+</option>
        <option value="2">★★ 2+</option>
        <option value="3">★★★ 3+</option>
        <option value="4">★★★★ 4+</option>
        <option value="5">★★★★★ 5</option>
      </select>
    </label>
    <label>Sort
      <select id="sortBy">
        <option value="default">Default order</option>
        <option value="rating-desc">Rating: high to low</option>
        <option value="rated-first">Rated first</option>
      </select>
    </label>
  </div>
  <p style="margin:8px 0 0;color:var(--muted);font-size:11.5px;">Click an image to view it full-size. Click the checkbox in the corner to select multiple for batch rating.</p>
</header>

<main id="main"></main>

<div id="lightbox">
  <span class="close">&times;</span>
  <div id="lightbox-media"></div>
  <div class="cap" id="lightbox-cap"></div>
</div>

<div id="batchBar">
  <span id="batchCount">0 selected</span>
  <span>Rate all:</span>
  <div class="stars-batch" id="batchStars">
    <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
  </div>
  <button class="clear-sel" id="clearSelection">Clear</button>
</div>

const cardIndex = {}; // imageId -> { cardEl, starsEl, noteBtn, noteEditor, noteTextarea }

function isVideo(file) { return /\.(mp4|webm|mov)$/i.test(file); }

function imageId(catId, subId, file) {
  return `${catId}__${subId || "_"}__${file}`;
}

// ---------- Move-to destination list ----------
const DEST_OPTIONS = [];
CATEGORIES.forEach(cat => {

    cat.subs.forEach(sub => {
      DEST_OPTIONS.push({ value: `${cat.id}__${sub.id}`, label: `${cat.emoji} ${cat.title} › ${sub.title}` });

  } else {
    DEST_OPTIONS.push({ value: `${cat.id}__` + "_", label: `${cat.emoji} ${cat.title}` });
  }
});

// ---------- Build DOM ----------
const catnav = document.getElementById('catnav');
const main = document.getElementById('main');

  const a = document.createElement('a');
  a.href = `#${cat.id}`;
  a.textContent = `${cat.emoji} ${cat.title}`;

  const catEl = document.createElement('div');
  catEl.className = 'category';
  catEl.id = cat.id;
  catEl.innerHTML = `<h2>${cat.emoji} ${cat.title}</h2>` + (cat.desc ? `<p class="desc">${cat.desc}</p>` : '');

  const renderImages = (images, folder, subId, container) => {
    if (!images.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No images yet — pending sourcing.';
      container.appendChild(empty);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    images.forEach(img => {
      const id = imageId(cat.id, subId, img.file);
      const src = `images/${folder}/${img.file}`;
      const fig = document.createElement('figure');
      fig.className = 'card';
      fig.dataset.id = id;
      fig.dataset.caption = img.caption.toLowerCase();

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      thumbWrap.innerHTML = isVideo(img.file)
        ? `<video src="${src}" muted loop playsinline></video>`
        : `<img src="${src}" loading="lazy" alt="">`;

      const checkEl = document.createElement('div');
      checkEl.className = 'select-check';
      checkEl.title = 'Select for batch rating';
      checkEl.addEventListener('click', (e) => { e.stopPropagation(); toggleSelect(id); });
      thumbWrap.appendChild(checkEl);

      const deleteEl = document.createElement('div');
      deleteEl.className = 'delete-x';
      deleteEl.textContent = '✕';
      deleteEl.title = 'Remove from library';
      deleteEl.addEventListener('click', (e) => { e.stopPropagation(); deleteImage(id); });
      thumbWrap.appendChild(deleteEl);

      thumbWrap.addEventListener('click', () => openLightbox(src, img.caption, isVideo(img.file)));
      if (isVideo(img.file)) {
        const v = thumbWrap.querySelector('video');
        thumbWrap.addEventListener('mouseenter', () => v.play());
        thumbWrap.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      }
      fig.appendChild(thumbWrap);

      const figcap = document.createElement('figcaption');
      figcap.textContent = img.caption;
      fig.appendChild(figcap);

      const ratingRow = document.createElement('div');
      ratingRow.className = 'rating-row';
      const starsEl = document.createElement('div');
      starsEl.className = 'stars';
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.textContent = '★';
        s.dataset.value = i;
        s.addEventListener('click', () => setRating(id, i));
        starsEl.appendChild(s);
      }
      const noteBtn = document.createElement('button');
      noteBtn.className = 'note-btn';
      noteBtn.textContent = 'why?';

      const moveSelect = document.createElement('select');
      moveSelect.className = 'move-select';
      moveSelect.innerHTML = `<option value="">Move to…</option>` + DEST_OPTIONS
        .filter(d => d.value !== `${cat.id}__${subId || "_"}`)
        .map(d => `<option value="${d.value}">${d.label}</option>`).join('');
      moveSelect.addEventListener('change', () => {
        if (moveSelect.value) moveImage(id, moveSelect.value);
      });

      ratingRow.appendChild(starsEl);
      ratingRow.appendChild(noteBtn);
      fig.appendChild(ratingRow);
      fig.appendChild(moveSelect);

      const noteEditor = document.createElement('div');
      noteEditor.className = 'note-editor';
      const textarea = document.createElement('textarea');
      textarea.placeholder = 'Why does this work? What to look for next time…';
      const saveHint = document.createElement('div');
      saveHint.className = 'save-hint';
      saveHint.textContent = 'Saves automatically when you click away.';
      noteEditor.appendChild(textarea);
      noteEditor.appendChild(saveHint);
      fig.appendChild(noteEditor);

      noteBtn.addEventListener('click', () => noteEditor.classList.toggle('open'));
      textarea.addEventListener('blur', () => setNote(id, textarea.value));

      cardIndex[id] = { cardEl: fig, starsEl, noteBtn, noteEditor, textarea, checkEl };
      grid.appendChild(fig);
    });
    container.appendChild(grid);
  };

  if (cat.subs) {
    cat.subs.forEach(sub => {
      const subEl = document.createElement('section');
      subEl.className = 'sub';
      subEl.id = `${cat.id}-${sub.id}`;
      subEl.innerHTML = `<h3>${sub.title} <span class="count">${sub.images.length} images</span></h3>`;
      renderImages(sub.images, sub.folder, sub.id, subEl);
      catEl.appendChild(subEl);
    });
  } else {
    const subEl = document.createElement('section');
    subEl.className = 'sub';
    renderImages(cat.images, cat.folder, null, subEl);
    catEl.appendChild(subEl);
  }

  main.appendChild(catEl);
});

// ---------- Lightbox ----------
const lightbox = document.getElementById('lightbox');
const lightboxMedia = document.getElementById('lightbox-media');
const lightboxCap = document.getElementById('lightbox-cap');

function openLightbox(src, cap, video) {
  lightboxMedia.innerHTML = video
    ? `<video src="${src}" controls autoplay loop></video>`
    : `<img src="${src}" alt="">`;
  lightboxCap.textContent = cap;
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) {
    lightbox.classList.remove('open');
    lightboxMedia.innerHTML = '';
  }
});
document.querySelector('#lightbox .close').addEventListener('click', () => {
  lightbox.classList.remove('open');
  lightboxMedia.innerHTML = '';
});

// ---------- Ratings backend ----------
function renderStars(id) {
  const rec = ratings[id];
  const stars = rec ? rec.stars : 0;
  const { starsEl, noteBtn, textarea } = cardIndex[id];
  [...starsEl.children].forEach((s, i) => {
    s.classList.toggle('filled', i < stars);
  });
  if (rec && rec.note) {
    noteBtn.classList.add('has-note');
    textarea.value = rec.note;
  } else {
    noteBtn.classList.remove('has-note');
  }
}

async function fetchRatings() {
  try {
    const res = await fetch(RATINGS_API);
    ratings = await res.json();
  } catch (e) {
    console.warn('Could not load ratings', e);
    ratings = {};
  }
  Object.keys(cardIndex).forEach(id => {
    if (ratings[id] && (ratings[id].deleted || ratings[id].movedTo)) {
      removeCard(id);
    } else {
      renderStars(id);
    }
  });
  applyFilters();
}

function removeCard(id) {
  const entry = cardIndex[id];
  if (!entry) return;
  entry.cardEl.remove();
  delete cardIndex[id];
  selected.delete(id);
  updateBatchBar();
}

async function deleteImage(id) {
  const current = ratings[id] || { stars: 0, note: '' };
  ratings[id] = { ...current, deleted: true };
  removeCard(id);
  try {
    await fetch(RATINGS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify({ imageId: id, stars: current.stars || 0, note: current.note || '', deleted: true })
    });
  } catch (e) {
    console.warn('Could not persist deletion', e);
  }
}

async function moveImage(id, destValue) {
  const current = ratings[id] || { stars: 0, note: '' };
  ratings[id] = { ...current, movedTo: destValue };
  removeCard(id);
  try {
    await fetch(RATINGS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify({ imageId: id, stars: current.stars || 0, note: current.note || '', movedTo: destValue })
    });
  } catch (e) {
    console.warn('Could not persist move', e);
  }
}

async function postRating(id, stars, note) {
  try {
    await fetch(RATINGS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Key': AUTH_KEY },
      body: JSON.stringify({ imageId: id, stars, note })
    });
  } catch (e) {
    console.warn('Could not save rating', e);
  }
}

function setRating(id, stars) {
  const current = ratings[id];
  const newStars = current && current.stars === stars ? 0 : stars; // click same star again to clear
  const note = current ? current.note : '';
  ratings[id] = { stars: newStars, note, updatedAt: new Date().toISOString() };
  renderStars(id);
  postRating(id, newStars, note);
  applyFilters();
}

function setNote(id, note) {
  const current = ratings[id] || { stars: 0 };
  ratings[id] = { stars: current.stars, note, updatedAt: new Date().toISOString() };
  renderStars(id);
  postRating(id, current.stars, note);
}

// ---------- Filter / sort ----------
const searchInput = document.getElementById('search');
const minRatingSelect = document.getElementById('minRating');
const sortBySelect = document.getElementById('sortBy');

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  const minRating = parseInt(minRatingSelect.value, 10);
  const sortBy = sortBySelect.value;

  Object.entries(cardIndex).forEach(([id, { cardEl }]) => {
    const rec = ratings[id];
    const stars = rec ? rec.stars : 0;
    const note = (rec && rec.note ? rec.note : '').toLowerCase();
    const caption = cardEl.dataset.caption;

    const matchesSearch = !q || caption.includes(q) || note.includes(q);
    const matchesRating = stars >= minRating;
    cardEl.classList.toggle('hidden', !(matchesSearch && matchesRating));
  });

  if (sortBy !== 'default') {
    document.querySelectorAll('.grid').forEach(grid => {
      const cards = [...grid.children];
      cards.sort((a, b) => {
        const ra = (ratings[a.dataset.id] || {}).stars || 0;
        const rb = (ratings[b.dataset.id] || {}).stars || 0;
        if (sortBy === 'rating-desc') return rb - ra;
        if (sortBy === 'rated-first') return (rb > 0) - (ra > 0);
        return 0;
      });
      cards.forEach(c => grid.appendChild(c));
    });
  }
}

searchInput.addEventListener('input', applyFilters);
minRatingSelect.addEventListener('change', applyFilters);
sortBySelect.addEventListener('change', applyFilters);

// ---------- Batch select & rate ----------
let selected = new Set();

const batchBar = document.getElementById('batchBar');
const batchCount = document.getElementById('batchCount');
const batchStars = document.getElementById('batchStars');
const clearSelectionBtn = document.getElementById('clearSelection');

function toggleSelect(id) {
  if (!cardIndex[id]) return;
  if (selected.has(id)) {
    selected.delete(id);
  } else {
    selected.add(id);
  }
  cardIndex[id].cardEl.classList.toggle('selected', selected.has(id));
  cardIndex[id].checkEl.textContent = selected.has(id) ? '✓' : '';
  updateBatchBar();
}

function updateBatchBar() {
  batchCount.textContent = `${selected.size} selected`;
  batchBar.classList.toggle('open', selected.size > 0);
}

function clearSelection() {
  selected.forEach(id => {
    if (cardIndex[id]) {
      cardIndex[id].cardEl.classList.remove('selected');
      cardIndex[id].checkEl.textContent = '';
    }
  });
  selected.clear();
  updateBatchBar();
}

clearSelectionBtn.addEventListener('click', clearSelection);

[...batchStars.children].forEach(starEl => {
  const val = parseInt(starEl.dataset.value, 10);
  starEl.addEventListener('mouseenter', () => {
    [...batchStars.children].forEach(s => s.classList.toggle('hover', parseInt(s.dataset.value, 10) <= val));
  });
  starEl.addEventListener('mouseleave', () => {
    [...batchStars.children].forEach(s => s.classList.remove('hover'));
  });
  starEl.addEventListener('click', () => {
    selected.forEach(id => setRating(id, val));
    clearSelection();
  });
});

fetchRatings();
</script>
