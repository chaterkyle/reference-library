<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Library</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #17171a;
    --border: #2a2a2e;
    --text: #eaeaec;
    --muted: #9a9aa0;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 32px 40px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,14,16,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    white-space: nowrap;
  }
  nav a:hover { color: var(--text); border-color: var(--accent); }
  main { padding: 8px 40px 80px; }
  section { margin-top: 48px; scroll-margin-top: 140px; }
  section h2 {
    font-size: 18px;
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  section h2 .count { font-size: 12px; color: var(--muted); font-weight: 400; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  figure:hover { border-color: var(--accent); }
  figure img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #000;
  }
  figcaption {
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 40px;
    flex-direction: column;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 4px;
  }
  #lightbox .cap {
    color: var(--text);
    margin-top: 16px;
    max-width: 700px;
    text-align: center;
    font-size: 14px;
    cursor: default;
  }
  #lightbox .close {
    position: absolute;
    top: 24px;
    right: 32px;
    color: var(--muted);
    font-size: 28px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Reference Library</h1>
  <p>Motion design reference, organized by theme — click any nav item to jump to a section.</p>
  <nav id="nav"></nav>
</header>

<main id="main"></main>

<div id="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <div class="cap" id="lightbox-cap"></div>

const nav = document.getElementById('nav');
const main = document.getElementById('main');

SECTIONS.forEach(sec => {
  const a = document.createElement('a');
  a.href = `#${sec.id}`;
  a.textContent = `${sec.emoji} ${sec.title}`;
  nav.appendChild(a);

  const section = document.createElement('section');
  section.id = sec.id;
  section.innerHTML = `<h2>${sec.emoji} ${sec.title} <span class="count">${sec.images.length} images</span></h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.images.forEach(img => {
    const fig = document.createElement('figure');
    const src = `images/${sec.folder}/${img.file}`;
    fig.innerHTML = `<img src="${src}" loading="lazy" alt=""><figcaption>${img.caption}</figcaption>`;
    fig.addEventListener('click', () => openLightbox(src, img.caption));
    grid.appendChild(fig);
  });
  section.appendChild(grid);
  main.appendChild(section);
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxCap = document.getElementById('lightbox-cap');

function openLightbox(src, cap) {
  lightboxImg.src = src;
  lightboxCap.textContent = cap;
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
